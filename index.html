<style>
:root{
  /* Layout: one phone-width column, header + view + bottom tab bar (works as an app on mobile, centered on desktop) */
  --bg:#F4F1EA; --surface:#FFFDF8; --ink:#1C1B22; --muted:#5B5866; --line:#DDD6C8;
  --accent:#C8102E; --accent-ink:#FFFFFF;
  --yes:#1F5FA8; --no:#A34A0B; --okbg:#E6EFF9; --warnbg:#FBEADB;
  --display:'Public Sans', Arial, sans-serif; --body:'Public Sans', Arial, sans-serif;
  --r:14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17161C; --surface:#22212A; --ink:#F2EFE8; --muted:#B4B0BD; --line:#3A3844;
  --accent:#FF5A50; --accent-ink:#17161C; --yes:#7FB2F0; --no:#F2A35E; --okbg:#1D2B3D; --warnbg:#3A2716; color-scheme: dark;}}
:root[data-theme="dark"]{
  --bg:#17161C; --surface:#22212A; --ink:#F2EFE8; --muted:#B4B0BD; --line:#3A3844;
  --accent:#FF5A50; --accent-ink:#17161C; --yes:#7FB2F0; --no:#F2A35E; --okbg:#1D2B3D; --warnbg:#3A2716; color-scheme: dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 var(--body);display:flex;justify-content:center}
.app{width:100%;max-width:560px;height:100%;height:100dvh;display:flex;flex-direction:column;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--surface)}
.brand{display:flex;align-items:center;gap:12px}
.brand b{font:800 22px/1 var(--display);letter-spacing:-.3px}
.brand small{color:var(--muted);font-size:12px;display:block;margin-top:4px}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;place-items:center}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:8px 12px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
main{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:16px}
nav{display:grid;grid-template-columns:repeat(5,1fr);border-top:1px solid var(--line);background:var(--surface)}
nav a{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 12px;color:var(--muted);text-decoration:none;font-size:12px;font-weight:600}
nav a svg{width:22px;height:22px}
nav a[aria-current="page"]{color:var(--accent)}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
h1{font-size:24px;line-height:1.15;font-weight:800;letter-spacing:-.2px}
h2{font-size:19px}
h3{font-size:16px}
p{margin:0}
.muted{color:var(--muted)}
.card{scroll-margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--ink);background:var(--ink);color:var(--bg);font:600 15px var(--body);padding:12px 16px;border-radius:12px;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink)}
.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.chip:focus-visible,nav a:focus-visible,.seg button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--yes);outline-offset:2px}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--body);padding:8px 12px;border-radius:999px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px}
.pill.yes{background:var(--okbg);color:var(--yes)}
.pill.no{background:var(--warnbg);color:var(--no)}
.pill.demo{background:transparent;border:1px dashed var(--muted);color:var(--muted);font-weight:600}
input,select{font:16px var(--body);padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
label{font-size:13px;font-weight:700;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:8px;flex:1;min-width:140px}
.map{width:100%;height:auto;display:block;background:var(--bg);border-radius:10px;border:1px solid var(--line);cursor:crosshair;touch-action:manipulation}
.lmap{height:320px;border-radius:10px;border:1px solid var(--line);background:var(--bg);isolation:isolate}
.lmap.leaflet-container{font:12px/1.4 var(--body)}
.lmap path.bin{fill:var(--muted);fill-opacity:.7;stroke:var(--surface);stroke-width:1}
.lmap.far path.bin{stroke-width:0;fill-opacity:.6}
.lmap path.sel{fill:var(--accent);fill-opacity:1;stroke:var(--surface);stroke-width:3}
.lmap path.near{fill:none;stroke:var(--yes);stroke-width:3}
.lmap path.me{fill:var(--yes);fill-opacity:1;stroke:var(--surface);stroke-width:3}
.lmap path.acc{fill:var(--yes);fill-opacity:.12;stroke:var(--yes);stroke-opacity:.45;stroke-width:1}
.lmap .leaflet-bar{border:1px solid var(--line);box-shadow:none}
.lmap .leaflet-bar a{background:var(--surface);color:var(--ink);border-bottom-color:var(--line)}
.lmap .leaflet-control-attribution{background:var(--surface);color:var(--muted);font-size:11px}
.lmap .leaflet-control-attribution a{color:var(--muted)}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]) .lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)} }
:root[data-theme="dark"] .lmap .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9)}
.btn.icon{display:inline-flex;align-items:center;gap:8px}
.btn.icon svg{width:18px;height:18px}
.btn:disabled{cursor:progress}
.bin-head{display:flex;gap:16px;align-items:center}
.pict{width:64px;height:64px;border-radius:16px;display:grid;place-items:center;flex:none;background:var(--bg);border:1px solid var(--line)}
.pict svg{width:38px;height:38px}
.meter{height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.meter i{display:block;height:100%;background:var(--yes)}
.tip{display:flex;gap:12px;align-items:center;background:var(--okbg);border-radius:12px;padding:12px}
.tip svg{flex:none;width:40px;height:40px}
.toast{background:var(--ink);color:var(--bg);border-radius:12px;padding:12px 16px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{padding:4px 12px;border-left:1px solid var(--line)}
.kpi:first-child{padding-left:0;border-left:0}
.kpi b{display:block;font:700 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted);display:block;-webkit-hyphens:auto;hyphens:auto;overflow-wrap:break-word}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:92px 1fr 48px;gap:8px;align-items:center;font-size:13px}
.bar .track{height:14px;position:relative}
.bar .fill{height:100%;border-radius:0 4px 4px 0;background:var(--muted);opacity:.55}
.bar.hl .fill{background:var(--accent);opacity:1}
.bar.hl{font-weight:700}
.bar .avg{position:absolute;top:-3px;bottom:-3px;border-left:2px dashed var(--ink)}
.bar span:last-child{text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line)}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
.chat{display:flex;flex-direction:column;gap:8px}
.msg{max-width:85%;padding:8px 12px;border-radius:14px;font-size:15px}
.msg.bot{background:var(--surface);border:1px solid var(--line);align-self:flex-start;border-bottom-left-radius:4px}
.msg.me{background:var(--yes);color:var(--surface);align-self:flex-end;border-bottom-right-radius:4px}
.item{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .pict{width:46px;height:46px;border-radius:12px}
.item .pict svg{width:26px;height:26px}
.cal{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.cal i{aspect-ratio:1;border-radius:5px;background:var(--yes)}
.cal i.bad{background:var(--no)}
.progress{height:16px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px;vertical-align:-1px}
.route{font-size:13px;font-weight:700;padding:4px 12px;border-radius:10px;align-self:flex-start}
.route.on{background:var(--warnbg);color:var(--no)}
.route.off{border:1px solid var(--line);color:var(--muted)}
.warn{background:var(--warnbg);border-radius:12px;padding:12px 16px;display:flex;flex-direction:column;gap:8px}
.seg.sub{flex:none;align-self:flex-start;background:var(--surface)}
.seg.sub a{color:var(--muted);font:600 14px var(--body);padding:8px 16px;text-decoration:none}
.seg.sub a[aria-current]{background:var(--ink);color:var(--bg)}
.seg.sub a:focus-visible{outline:3px solid var(--yes);outline-offset:-3px}
.avatar{width:40px;height:40px;border-radius:50%;flex:none;display:grid;place-items:center;font-weight:700;color:var(--surface)}
.pilot td{vertical-align:top;padding:8px 4px}
.pilot td span{display:block;font-size:13px}
.pilot td:first-child,.pilot th:first-child{padding-left:0;width:24px}
.badge{display:flex;gap:8px;align-items:center;padding:8px;border-radius:12px;border:1px dashed var(--line);font-size:14px;color:var(--muted)}
.badge span:first-child{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--bg);font-weight:700}
.badge.on{border:1px solid var(--yes);color:var(--ink);font-weight:700}
.badge.on span:first-child{background:var(--yes);color:var(--surface)}
[hidden]{display:none !important}
@media (prefers-reduced-motion: reduce){*{transition:none !important}}
</style>

// ---------- geo helpers ----------
function dist(a,b){ const R=6371000, toR=Math.PI/180;
  const dLat=(b.lat-a.lat)*toR, dLon=(b.lon-a.lon)*toR;
  const h=Math.sin(dLat/2)**2+Math.cos(a.lat*toR)*Math.cos(b.lat*toR)*Math.sin(dLon/2)**2;
  return 2*R*Math.asin(Math.sqrt(h)); }
function nearestSame(bin){ let best=null, bd=Infinity;
  for(const o of BINS){ if(o===bin||o.f!==bin.f) continue; const d=dist(bin,o); if(d<bd){bd=d;best=o;} }
  return best ? {bin:best, d:Math.round(bd)} : null; }
function hash(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619);} return (h>>>0); }

const ALLX=[...BINS.map(b=>b.lon), ...OUTLINE.map(p=>p[0])], ALLY=[...BINS.map(b=>b.lat), ...OUTLINE.map(p=>p[1])];
const LON0=Math.min(...ALLX), LON1=Math.max(...ALLX);
const LAT0=Math.min(...ALLY), LAT1=Math.max(...ALLY);
const KX=Math.cos(52.31*Math.PI/180);
const MW=500, PAD=12, SCALE=(MW-2*PAD)/((LON1-LON0)*KX), MH=Math.round((LAT1-LAT0)*SCALE+2*PAD);
const px=b=>PAD+(b.lon-LON0)*KX*SCALE, py=b=>PAD+(LAT1-b.lat)*SCALE;

function mapSVG(mode, sel, near){
  const list = mode==='abp' ? [...BINS].sort((x,y)=>(x.r?1:0)-(y.r?1:0)) : BINS; // route dots on top
  const dots = list.map(b=>{
    let fill, op;
    if(mode==='adopt'){ fill = b.a ? 'var(--yes)' : 'var(--no)'; op=.85; }
    else if(mode==='abp'){ fill = b.r ? 'var(--no)' : 'var(--muted)'; op = b.r ? .9 : .35; }
    else { fill='var(--muted)'; op=.45; }
    return `<circle cx="${px(b).toFixed(1)}" cy="${py(b).toFixed(1)}" r="3.2" fill="${fill}" opacity="${op}"/>`;
  }).join('');
  let extra='';
  if(near) extra+=`<circle cx="${px(near).toFixed(1)}" cy="${py(near).toFixed(1)}" r="8" fill="none" stroke="var(--yes)" stroke-width="3"/>`;
  if(sel) extra+=`<circle cx="${px(sel).toFixed(1)}" cy="${py(sel).toFixed(1)}" r="9" fill="var(--accent)" stroke="var(--surface)" stroke-width="3"/>`;
  const outline = OUTLINE.length ? `<path d="M${OUTLINE.map(p=>px({lon:p[0],lat:p[1]}).toFixed(1)+','+py({lon:p[0],lat:p[1]}).toFixed(1)).join('L')}Z" fill="var(--surface)" stroke="var(--line)" stroke-width="2"/>` : '';
  const label = mode==='abp' ? t('map_abp') : mode==='adopt' ? t('map_adopt') : 'Map of Zuidoost containers';
  return `<svg class="map" ${mode==='plain'?'id="map" ':''}viewBox="0 0 ${MW} ${MH}" role="img" aria-label="${label}">${outline}${dots}${extra}</svg>`;
}
function bindMap(onPick){
  const svg=document.getElementById('map'); if(!svg) return;
  svg.addEventListener('click', e=>{
    const r=svg.getBoundingClientRect(); const x=(e.clientX-r.left)*MW/r.width, y=(e.clientY-r.top)*MH/r.height;
    let best=null, bd=Infinity; for(const b of BINS){ const d=(px(b)-x)**2+(py(b)-y)**2; if(d<bd){bd=d;best=b;} }
    if(best && bd<400) onPick(best);
  });
}

// ---------- live map: Leaflet + PDOK basemap (Kadaster). Falls back to the SVG map if Leaflet can't load ----------
const PDOK='https://service.pdok.nl/brt/achtergrondkaart/wmts/v2_0/grijs/EPSG:3857/{z}/{x}/{y}.png';
const LM={map:null, el:null, want:null};
let loc={st:''}; // '', 'wait', 'ok', 'far', 'denied', 'error'. Kept in memory only, never stored or sent.
const allBounds=()=>L.latLngBounds(BINS.map(b=>[b.lat,b.lon]));
function lmapMount(onPick){
  const slot=document.getElementById('mapslot'); if(!slot) return false;
  LM.onPick=onPick;
  if(!LM.el){ LM.el=document.createElement('div'); LM.el.className='lmap'; LM.el.setAttribute('aria-label','Map of Zuidoost containers'); }
  slot.replaceWith(LM.el);
  if(LM.map){ LM.map.invalidateSize(); return false; }
  LM.map=L.map(LM.el,{scrollWheelZoom:false, dragging:!L.Browser.mobile, maxZoom:19}).fitBounds(allBounds(),{padding:[8,8]}); // a view must exist before markers are drawn
  LM.map.attributionControl.setPrefix('<a href="https://leafletjs.com">Leaflet</a>');
  L.tileLayer(PDOK,{maxZoom:19, attribution:'Kaart © <a href="https://www.kadaster.nl">Kadaster</a> (PDOK)'}).addTo(LM.map);
  const dotR=z=>z<=12?2:z<=13?2.5:z<=14?3:z<=15?3.5:4.5; // keep 1,206 dots readable at every zoom
  LM.bins=BINS.map(b=>L.circleMarker([b.lat,b.lon],{radius:dotR(LM.map.getZoom()), className:'bin', bubblingMouseEvents:false}).on('click',()=>LM.onPick(b)).addTo(LM.map));
  const onZoom=()=>{ const z=LM.map.getZoom(); LM.el.classList.toggle('far', z<=13); for(const mk of LM.bins) mk.setRadius(dotR(z)); };
  LM.map.on('zoomend', onZoom); onZoom();
  LM.map.on('click',e=>{ let best=null, bd=Infinity; // fat-finger friendly: nearest dot within 24px of the tap
    for(const b of BINS){ const d=LM.map.latLngToContainerPoint([b.lat,b.lon]).distanceTo(e.containerPoint); if(d<bd){bd=d;best=b;} }
    if(best && bd<24) LM.onPick(best); });
  LM.near=L.circleMarker([0,0],{radius:11, className:'near', interactive:false});
  LM.sel=L.circleMarker([0,0],{radius:9, className:'sel', interactive:false});
  LM.acc=L.circle([0,0],{radius:1, className:'acc', interactive:false});
  LM.me=L.circleMarker([0,0],{radius:7, className:'me', interactive:false});
  return true;
}
function lmapUpdate(b, near, first){
  const m=LM.map, ll=L.latLng(b.lat,b.lon);
  if(near) LM.near.setLatLng([near.lat,near.lon]).addTo(m); else LM.near.remove();
  LM.sel.setLatLng(ll).addTo(m); LM.sel.bringToFront();
  const hasMe=loc.st==='ok'||loc.st==='far';
  if(hasMe){ LM.acc.setLatLng([loc.lat,loc.lon]).setRadius(Math.min(loc.acc||0,500)).addTo(m); LM.me.setLatLng([loc.lat,loc.lon]).addTo(m); LM.me.bringToFront(); }
  else { LM.acc.remove(); LM.me.remove(); }
  const want=first ? (DEEP_BIN?'deep':'all') : LM.want; LM.want=null;
  if(want==='all') m.fitBounds(allBounds(),{padding:[8,8]});
  else if(want==='deep') m.setView(ll,17);
  else if(want==='sel'){ if(near) m.fitBounds(L.latLngBounds([ll,[near.lat,near.lon]]),{padding:[40,40],maxZoom:18});
    else if(m.getZoom()<16) m.setView(ll,16); else if(!m.getBounds().pad(-0.2).contains(ll)) m.panTo(ll); }
  else if(want==='me'){ if(loc.st==='ok') m.fitBounds(L.latLngBounds([[loc.lat,loc.lon],ll]),{padding:[48,48],maxZoom:18});
    else if(loc.st==='far') m.fitBounds(allBounds().extend([loc.lat,loc.lon]),{padding:[24,24]}); }
}
function locate(){
  if(!navigator.geolocation){ loc={st:'error'}; render(); return; }
  loc={st:'wait'}; render();
  navigator.geolocation.getCurrentPosition(pos=>{
    const me={lat:pos.coords.latitude, lon:pos.coords.longitude};
    let best=null, bd=Infinity; for(const o of BINS){ const d=dist(me,o); if(d<bd){bd=d;best=o;} }
    loc={st:bd>1500?'far':'ok', lat:me.lat, lon:me.lon, acc:pos.coords.accuracy, d:Math.round(bd)};
    if(loc.st==='ok'){ current=best; store.set('last',best.id); }
    notes.clear(); LM.want='me'; render();
  }, err=>{ loc={st:err.code===1?'denied':'error'}; render(); }, {enableHighAccuracy:true, timeout:12000, maximumAge:30000});
}
function locNote(){
  if(loc.st==='ok') return `<p style="font-size:14px">${t('loc_ok').replace('{d}',loc.d)}</p>`;
  if(loc.st==='far') return `<p class="muted" style="font-size:14px">${t('loc_far').replace('{km}',(loc.d/1000).toLocaleString(lang==='nl'?'nl-NL':'en-GB',{maximumFractionDigits:1}))}</p>`;
  if(loc.st==='denied'||loc.st==='error') return `<p class="muted" style="font-size:14px">${t('loc_'+loc.st)}</p>`;
  return '';
}

// "Is it full?": neighbour taps (fill sensors come later). Demo: ~4% of containers show a simulated neighbour report, matching the city's finding
function fullInfo(b){
  const at=store.get('fulltaps',{})[b.id];
  if(at && Date.now()-at < 3*3600e3) return {who:'you', m:Math.max(0,Math.round((Date.now()-at)/60000))};
  const h=hash(b.id); if(h%100<4) return {who:'neighbour', m:5+(h%40), demo:true};
  return null;
}
function altSpots(b){ // same type: one right next to it (same spot), and the nearest one further away
  let sib=null, sd=Infinity, far=null, fd=Infinity;
  for(const o of BINS){ if(o===b||o.f!==b.f) continue; const d=dist(b,o);
    if(d<=25){ if(d<sd){sd=d;sib=o;} } else if(d<fd){fd=d;far=o;} }
  return {sib, far: far?{bin:far,d:Math.round(fd)}:null};
}
function routeBadge(b){ // ABP route list, October 2026
  if(!b.r) return `<p class="route off">${t('route_off')}</p>`;

}

let chat = {step:0, item:null, usable:null, date:null, addr:'', ref:null};
function nextDays(start){ const out=[]; const d=new Date(); for(let i=start;i<start+3;i++){ const x=new Date(d); x.setDate(d.getDate()+i);
  out.push(x.toLocaleDateString(lang==='nl'?'nl-NL':'en-GB',{weekday:'long',day:'numeric',month:'long'})); } return out; }
function viewBulky(){
  const m=[]; const bot=s=>m.push(`<div class="msg bot">${s}</div>`), me=s=>m.push(`<div class="msg me">${esc(s)}</div>`);
  bot(t('b_q1')); let controls='';
  if(chat.step===0) controls=t('b_items').map((x,i)=>`<button class="chip" type="button" data-item="${i}">${x}</button>`).join('');
  if(chat.step>=1){ me(t('b_items')[chat.item]); bot(t('b_q2')); }
  if(chat.step===1) controls=`<button class="chip" type="button" data-usable="1">${t('yes')}</button><button class="chip" type="button" data-usable="0">${t('no')}</button>`;
  if(chat.step>=2){ me(chat.usable?t('yes'):t('no')); if(chat.usable) bot(t('b_give')); bot(t(chat.usable?'b_q3_give':'b_q3')); }
  if(chat.step===2) controls=(chat.usable?`<a class="btn accent" href="#give" style="text-decoration:none">${t('b_give_btn')}</a>`:'')+nextDays(chat.usable?3:1).map(d=>`<button class="chip" type="button" data-date="${esc(d)}">${d}</button>`).join('');
  if(chat.step>=3){ me(chat.date); bot(t('b_q4')); }
  if(chat.step===3) controls=`<form id="addrform" class="row" style="width:100%"><div class="field"><label for="addr">${t('b_q4')}</label><input id="addr" placeholder="${t('b_addr_ph')}" required></div><button class="btn" type="submit">${t('send')}</button></form>`;
  if(chat.step>=4){ me(chat.addr); bot(t('b_done').replace('{r}',chat.ref).replace('{i}',t('b_items')[chat.item].toLowerCase()).replace('{d}',chat.date)); controls=`<button class="btn ghost" type="button" id="restart">${t('restart')}</button>`; }
  return `<section class="card"><h1>${t('bulky_title')}</h1><p class="muted">${t('bulky_sub')}</p></section>
  <section class="card"><div class="chat">${m.join('')}</div><div class="row">${controls}</div></section>`;
}
function bindBulky(){
  document.querySelectorAll('[data-item]').forEach(el=>el.addEventListener('click',()=>{ chat.item=+el.dataset.item; chat.step=1; render(); }));
  document.querySelectorAll('[data-usable]').forEach(el=>el.addEventListener('click',()=>{ chat.usable=el.dataset.usable==='1'; chat.step=2; render(); }));
  document.querySelectorAll('[data-date]').forEach(el=>el.addEventListener('click',()=>{ chat.date=el.dataset.date; chat.step=3; render(); }));
  const f=document.getElementById('addrform'); if(f) f.addEventListener('submit',e=>{ e.preventDefault(); chat.addr=document.getElementById('addr').value.trim(); if(!chat.addr) return;
    chat.ref='ZO-'+(1000+hash(chat.addr+chat.date)%9000); chat.step=4; render(); });
  const r=document.getElementById('restart'); if(r) r.addEventListener('click',()=>{ chat={step:0}; render(); });
}

function mySpot(){ return BINS.find(x=>x.id===store.get('spot',null)) || current; }
function cleanDays(b){ const h=hash(b.id); return [...Array(30)].map((_,i)=>((h>>(i%28))&7)===0); } // demo pattern
function season(b){ // demo: the start is measured in the first 4 weeks; the goal closes 60% of the gap to 30 bag-free days
  const h=hash(b.id), clean=cleanDays(b).filter(x=>!x).length;
  const start=Math.max(6, clean-3-h%6), goal=Math.min(30, start+Math.round((30-start)*.6));
  return {clean, start, goal};
}

}

function bindGame(){

const ROUTES={bin:[viewBin,bindBin], bulky:[viewBulky,bindBulky], give:[viewGive,bindGive], spot:[viewSpot,bindSpot], game:[viewGame,bindGame], radar:[viewRadar,()=>{}]};
const TABS=['bin','bulky','give','spot','radar']; // the Block game lives under My spot
function route(){ const r=location.hash.slice(1); return ROUTES[r]?r:'bin'; }
function render(){
  const r=route();
  document.documentElement.lang=lang;
  document.getElementById('tagline').textContent=t('tagline');
  document.getElementById('lang-nl').setAttribute('aria-pressed', lang==='nl');
  document.getElementById('lang-en').setAttribute('aria-pressed', lang==='en');
  document.getElementById('tabs').innerHTML=TABS.map(k=>`<a href="#${k}" ${(k===r||(k==='spot'&&r==='game'))?'aria-current="page"':''}>${TAB_ICON[k]}<span>${t('tab_'+k)}</span></a>`).join('');
  const v=document.getElementById('view'); v.innerHTML=ROUTES[r][0](); ROUTES[r][1]();
}
window.addEventListener('hashchange',()=>{ notes.clear(); render(); document.getElementById('view').scrollTop=0; });
document.getElementById('lang-nl').addEventListener('click',()=>{ lang='nl'; store.set('lang',lang); render(); });
document.getElementById('lang-en').addEventListener('click',()=>{ lang='en'; store.set('lang',lang); render(); });
render();
if(DEEP_BIN && route()==='bin') document.getElementById('bincard').scrollIntoView({block:'start'});
</script>
